name: Evidence bridge

# Mission Loop's evidence source. Polls GitHub PR/check state on a schedule
# and upserts rows directly into the `evidence_snapshots` Supabase table
# using the service-role key (bypasses RLS — see
# supabase/migrations/0001_mission_loop.sql). MissionTab reads that table
# directly, so there is no intermediate file for this workflow to commit.
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Pull evidence and upsert into Supabase
        env:
          # Default GITHUB_TOKEN only reaches this repo. Set the
          # EVIDENCE_BRIDGE_TOKEN secret to a PAT if EVIDENCE_REPOS should
          # include other repos in the Codex ecosystem.
          EVIDENCE_BRIDGE_TOKEN: ${{ secrets.EVIDENCE_BRIDGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          EVIDENCE_REPOS: edwardemoryphotography/legacy-codex
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/evidence-bridge.mjs
